name: Compile and lint

on:
  push:
    branches: [ "improve" ]
  pull_request:
    branches: [ "improve" ]

jobs:
  build:
    runs-on: ubuntu-latest
    name: Test for a successful build and correctly formatted code
    steps:
    - uses: actions/checkout@v4
    - name: Install pnpm
      uses: pnpm/action-setup@v4
      with:
        version: 10
    - name: Use Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 24.x
        cache: 'pnpm'
    - name: Install dependencies
      run: pnpm install

    - name: Lint and Test
      run: pnpm run check && pnpm test

    - name: Build
      run: pnpm build
